name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  foundation:
    name: Foundation (Go module)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: go build ./...
      - run: go vet ./...
      # -p 1: the integration tests in auth/ and files/ share this one database
      # and each wipe `users` on setup, so their packages must run serially.
      - run: go test -p 1 ./...

  app-server:
    name: Example app (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template/server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  web:
    name: Example app (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  contract:
    name: OpenAPI contract is fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Regenerate spec from Go handlers
        run: cd template/server && go run ./cmd/openapi -o openapi.json
      - name: Regenerate TypeScript client types
        run: cd template/web && bun install --frozen-lockfile && bun run gen:api
      - name: Fail if committed spec or types are stale
        run: git diff --exit-code -- template/server/openapi.json template/web/src/lib/api/schema.d.ts
