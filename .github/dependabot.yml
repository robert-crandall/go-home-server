# Dependabot for this repo: the Go module and the GitHub Actions used by its
# workflows.
#
# Updates are grouped by ecosystem into a single PR each, weekly. Combined with
# the dependabot-auto-merge workflow, these PRs merge themselves once CI is
# green.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
