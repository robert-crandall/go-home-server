services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app?sslmode=disable
      ADDR: ":8080"
      APP_ENV: production
      # First-user-only by default. Set true for a multi-user app.
      ALLOW_OPEN_REGISTRATION: "false"
      # Generate a pair with: cd server && go run ./cmd/vapid
      VAPID_PUBLIC_KEY: ""
      VAPID_PRIVATE_KEY: ""
      VAPID_SUBJECT: "mailto:you@example.com"
      # Where uploaded files are written. Must match the bind mount below - the
      # app refuses to create the directory, so dropping the mount is a startup
      # crash rather than photos written to a disposable container layer.
      UPLOAD_DIR: /data/uploads
      # Caps a single upload request body. Unset = 25 MiB.
      #UPLOAD_MAX_BYTES: "26214400"
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
