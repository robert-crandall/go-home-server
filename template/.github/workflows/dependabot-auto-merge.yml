# Auto-merge Dependabot PRs once CI is green, so dependency updates don't need a
# human.
#
# Standalone workflow for an app generated from this template. It is inert inside
# the go-home-server repo (GitHub only runs workflows under the repo-root
# .github), and becomes the app's Dependabot auto-merge once the template is
# copied to its own repo.
#
# This runs *after* the CI workflow finishes (workflow_run), not during the PR
# itself, which means:
#   - it only ever fires once CI has actually completed, and
#   - it runs from the default branch with a token that honors the permissions
#     block below (Dependabot's own PR runs get a read-only token by default).
#
# We deliberately do NOT use branch protection + native auto-merge: that would
# require a required-status-check merge blocker on main, which would also block
# direct pushes to main.
#
# Build note: this merges with the built-in GITHUB_TOKEN, and GitHub suppresses
# all workflow triggers from GITHUB_TOKEN-authored events. So the merge commit
# does NOT kick the push-triggered CI -> docker-publish chain; an auto-merged
# dependency update lands on main without publishing an image, and is first
# included in the next normal publish (the next push to main). That's an
# intentional trade to keep the No-PAT model (docker-publish.yml is explicitly
# PAT-free). If you want every dependency update to publish an image
# immediately, do the merge with a GitHub App or PAT token instead of
# GITHUB_TOKEN and the normal push pipeline will fire.
name: Dependabot auto-merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only Dependabot PR runs, and only when every CI job passed. The actor is
    # the login that caused the CI run; a fork can't make that dependabot[bot],
    # so this is spoof-safe.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - name: Squash-merge the passing Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # Base branch tip that CI actually validated the merge against.
          BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
        run: |
          set -euo pipefail

          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
                 --json number,author \
                 --jq '.[] | select(.author.login=="dependabot[bot]") | .number' | head -n1)
          if [ -z "$pr" ]; then
            echo "No open Dependabot PR for $BRANCH; nothing to merge."
            exit 0
          fi

          # Don't auto-merge Docker base-image bumps: no CI job builds the image,
          # so a green run doesn't actually validate them. They open as PRs for a
          # quick manual merge instead. (Add a `docker build` job to ci.yml if you
          # want these validated and auto-merged too.)
          case "$BRANCH" in
            dependabot/docker/*)
              echo "Docker PR $BRANCH isn't validated by CI; leaving for manual review."
              exit 0
              ;;
          esac

          # If main moved since CI ran, the tested merge is stale. Skip and let
          # the next CI run (Dependabot rebases) handle it, rather than merge an
          # untested combination into main.
          if [ -n "$BASE_SHA" ]; then
            current_base=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            if [ "$current_base" != "$BASE_SHA" ]; then
              echo "main advanced since CI passed ($BASE_SHA -> $current_base); skipping."
              exit 0
            fi
          fi

          # --match-head-commit refuses the merge if the PR head moved after CI
          # (Dependabot force-pushes on rebase), so we never merge an untested tip.
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --delete-branch \
            --match-head-commit "$HEAD_SHA"
