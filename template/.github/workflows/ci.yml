name: CI

# Standalone CI for an app generated from this template. It is inert inside the
# go-home-server repo (GitHub only runs workflows under the repo-root .github),
# and becomes the app's CI once the template is copied to its own repo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  contract:
    name: OpenAPI contract is fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      # `make gen-api` assumes node_modules already exists, which is true
      # locally and false on a fresh checkout.
      - name: Install web dependencies
        run: cd web && bun install --frozen-lockfile
      # Same target you run locally, so CI can't drift from the documented loop.
      # Spec generation never touches the database, so no Postgres service here.
      - name: Regenerate spec and client types
        run: make gen-api
      - name: Fail if committed spec or types are stale
        run: git diff --exit-code -- server/openapi.json web/src/lib/api/schema.d.ts
