# Build and publish the app image to GHCR on every green push to main.
#
# No-PAT publish path: it uses the workflow's built-in GITHUB_TOKEN
# (packages: write) to push to ghcr.io/<owner>/<repo>.
#
# Tags emitted:
#   - `latest`          mutable, only ever moved by the default branch, so
#                       whatever pulls `latest` on your host tracks main
#   - `main-<short-sha>` immutable, one per built commit for traceability
#
# Trigger: gated behind CI. It runs only after the `CI` workflow COMPLETES, and
# the guard job below requires the triggering run to be a push (not a PR) whose
# CI conclusion was `success`. So the image is never published for a red commit,
# and never for a pull_request-triggered CI run. Note `workflow_run` DOES fire
# for CI runs triggered by pull_request; it is the `event == 'push'` guard below
# (not the trigger itself) that prevents PRs/forks from publishing.
#
# Ordering: `workflow_run` events arrive in CI-completion order, not push order,
# so an older commit's CI can finish after a newer commit's. The concurrency
# group only serializes runs, it does not reorder them, so a stale run could
# otherwise move the mutable `latest` tag backward. The "Skip superseded commits"
# step drops any run whose head_sha is no longer the branch tip, keeping `latest`
# monotonic.
#
# Note: `workflow_run` reads its trigger configuration from the workflow file on
# the repository's DEFAULT branch (main). This becomes effective once this file
# lands on main; from then on every green push to main publishes.
#
# This workflow ships with the go-home-server template and is INERT inside the
# go-home-server repo itself (GitHub only runs workflows under the repo-root
# .github). It becomes an app's publish pipeline once the template is copied to
# its own repo by scripts/new-app.sh.

name: Build and Publish Docker Image

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  # Gate publishes. This job runs only for a successful, push-triggered CI run
  # (never a pull_request), and then verifies the built commit is still the tip
  # of its branch. Splitting this out means the whole publish job below is
  # skipped atomically when the trigger is a PR/red run or when the commit has
  # been superseded — no per-step guards, no partial publishes.
  guard:
    name: Guard publish (push + success + not superseded)
    runs-on: ubuntu-latest
    # The `event == 'push'` guard makes the "never publish from a PR" guarantee
    # airtight: workflow_run also fires for pull_request-triggered CI runs, and
    # the branches filter only matches head_branch. Requiring event == 'push'
    # closes that hole; the success check blocks red commits.
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
    outputs:
      fresh: ${{ steps.check.outputs.fresh }}
    steps:
      - name: Skip superseded commits
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip="$(gh api "repos/${{ github.repository }}/branches/${BRANCH}" --jq '.commit.sha')"
          if [ "$tip" = "$BUILT_SHA" ]; then
            echo "Built commit ${BUILT_SHA} is the current tip of ${BRANCH}; publishing."
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Built commit ${BUILT_SHA} is no longer the tip of ${BRANCH} (now ${tip}); skipping publish so an older CI run cannot move the latest tag backward."
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: guard
    # Only publish when the guard job cleared the run (push + success + still the
    # branch tip). If guard is skipped, needs.guard.outputs.fresh is empty and
    # this job is skipped too.
    if: ${{ needs.guard.outputs.fresh == 'true' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Build the exact commit CI validated, not the branch tip.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build metadata
        id: vars
        run: |
          full="${{ github.event.workflow_run.head_sha }}"
          echo "sha_full=${full}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${full:0:7}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tags are derived directly from the CI-validated head_sha, not from any
          # git/workflow context. Under workflow_run, github.sha is the default
          # branch head (not what we built), and `context: git` throws on the
          # detached SHA-only checkout above, which would fail a legitimate
          # publish. type=raw sidesteps both.
          #
          # `latest` is only moved by the default branch; every push still gets
          # its immutable `main-<sha>` image.
          tags: |
            type=raw,value=latest,enable=${{ github.event.workflow_run.head_branch == github.event.repository.default_branch }}
            type=raw,value=main-${{ steps.vars.outputs.sha_short }}
          # Pin the OCI revision/version labels to the built commit so the image
          # is traceable back to the exact commit CI validated.
          labels: |
            org.opencontainers.image.revision=${{ steps.vars.outputs.sha_full }}
            org.opencontainers.image.version=main-${{ steps.vars.outputs.sha_short }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
